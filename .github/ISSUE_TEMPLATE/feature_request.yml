name: Feature request
description: An idea for a new screen, flow or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should the bride or owner be able to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: Sketches, screenshots or reference apps are welcome.
